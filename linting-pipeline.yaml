name: Linting Check

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Run HTMLHint
      run: npx htmlhint "src/**/*.html"

    - name: Run Stylelint
      run: npx stylelint "styles/**/*.css"

